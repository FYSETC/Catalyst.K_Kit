[multi_pin heater_fans]
pins:ToolHead:PA14,PA3

[fan]
pin: multi_pin:heater_fans
max_power: 1.0

[heater_fan hotend_fan]
pin: ToolHead:PB5
heater: extruder
heater_temp: 40

[temperature_fan chamber_fan]
pin: PB2
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
min_temp: 0
max_temp: 200
control: watermark
max_delta: 2
target_temp: 35.0
max_speed: 1.0
min_speed: 0.0

[controller_fan board_driver_fan]
pin:PA1
max_power:1.0
shutdown_speed:0
# tachometer_pin: PC2
idle_speed:0.3
stepper: stepper_z

#####################################################################
#	LED Control
#####################################################################
[output_pin LED]
pin: PD12
pwm: True
cycle_time: 0.010
value: 0

#####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 99999999

[gcode_macro _HOME_XY]
gcode:
    {% set x_run = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set y_run = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set home_current = 0.45 %}
    G90
    {% if "xy" in printer.toolhead.homed_axes %}
        G0 X110 Y110 F3600
    {% endif %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_current}
    G4 P1000
    G28 X
    G4 P2000
    G91
    # G1 X-15 F1200
    G90
    G28 Y
    G4 P1000
    G91
    # G1 Y15 F1200
    G90
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={x_run}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={y_run}

[homing_override]
axes: z
set_position_z: 0
gcode:
  G90
  G0 Z10 F600
  # G28 X Y
  _HOME_XY
  G0 X110 Y110 F3600

  G28 Z
  G0 Z10 F1800
  G0 X110 Y110 Z10 F3600

[bed_mesh]
speed: 200
horizontal_move_z: 10
mesh_min: 20,20
mesh_max: 200,200
probe_count: 5, 5
fade_start: 1.0
fade_end: 0.0
fade_target:0
split_delta_z: .025
move_check_distance: 10.0
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: .2
zero_reference_position: 110.0,110.0

[bed_screws]
screw1: 30,30
screw1_name: front left
screw2: 30,190
screw2_name: back left
screw3: 190,190
screw3_name: back right
screw4: 190,30
screw4_name: front right

[adxl345]
cs_pin: ToolHead:PA0
spi_software_sclk_pin: ToolHead:PA5
spi_software_mosi_pin: ToolHead:PA7
spi_software_miso_pin: ToolHead:PA6
axes_map: -y,z,-x

[resonance_tester]
accel_chip: adxl345
probe_points:
    150,150,10

[filament_switch_sensor filment]
switch_pin: ^!PE8

[temperature_sensor toolhead_temp]
sensor_type: temperature_mcu
sensor_mcu: ToolHead
min_temp: 0
max_temp: 100

[gcode_arcs]
resolution: 1.0

#####################################################################
#	Macros
#####################################################################
[gcode_macro PRINT_START]
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
    {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
	{action_respond_info("PRINT_START")}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=1
    G28
    BED_MESH_CALIBRATE
    G0 X110 Y110 Z10 F1000
    G28 Z
   
    G90                            ; Use absolute coordinates
    M190 S{BED_TEMP}               ; Heat bed for probing
    M109 S{EXTRUDER_TEMP}          ; Set and wait for nozzle to reach printing temperature

    SET_GCODE_OFFSET X=0 Y=0 Z=0.25 MOVE=1
    SET_PIN PIN=LED VALUE=1.0
    G0 X10 Y10 Z0.2 F3000
    G0 X10 Y100 Z0.2 E50 F1000


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament
    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X110 Y200 F3600            ; park nozzle at rear
    BED_MESH_CLEAR
    SET_PIN PIN=LED VALUE=0
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0

[display_status]

[pause_resume]

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    ##### set defaults #####
    {% set x = params.X|default(230) %}      #edit to your park position
    {% set y = params.Y|default(230) %}      #edit to your park position
    {% set z = params.Z|default(10)|float %} #edit to your park position
    {% set e = params.E|default(1) %}        #edit to your retract length
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{e} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}    
      G1 Z{z_safe}
      G90
      G1 X{x} Y{y} F6000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    ##### set defaults #####
    {% set e = params.E|default(1) %} #edit to your retract length
    #### get VELOCITY parameter if specified ####
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}
    ##### end of definitions #####
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E{e} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}  
    RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  SET_FAN_SPEED FAN=auxiliary_fan SPEED=0
  SET_PIN PIN=LED VALUE=0
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0


[virtual_sdcard]
path: ~/printer_data/gcodes



