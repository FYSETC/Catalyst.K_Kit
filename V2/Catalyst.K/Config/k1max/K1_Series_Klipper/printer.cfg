[extruder]
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 80
step_pin: ToolHead:PB7
dir_pin: ToolHead:PB6
enable_pin: !ToolHead:PB9
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ToolHead:PC15
sensor_type: EPCOS 100K B57560G104F
sensor_pin: ToolHead:PB2
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040
control: pid
pid_Kp: 25.013
pid_Ki: 2.566
pid_Kd: 60.966
# pid_Kp: 60
# pid_Ki: 0.1
# pid_Kd: 5
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: ToolHead:PA15
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[heater_bed]
heater_pin: !PB0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
pid_Kp: 37
pid_Ki: 0.18
pid_Kd: 280
min_temp: 0
max_temp: 125

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !PE8
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G0 E30 F600
    G90
  {% endif %}

[filament_switch_sensor filament_sensor_2]
pause_on_runout: false
switch_pin: ToolHead:PC14
# switch_pin: !ToolHead:PC14

[multi_pin heater_fans]
pins: ToolHead:PB5

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 40

# Turn on the fan on the second layer of the extruder.
[output_pin fan0]
pin: ToolHead:PA14
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

# Bottom Motherboard Cooling Fan
[output_pin fan1]
pin: PB10
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

# Auxiliary Fan
[output_pin fan2]
pin: PA3
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin LED]
pin: PD12
pwm: True
cycle_time: 0.010
value: 1

# [output_pin power]
# pin: ToolHead:PB3
# pwm: False
# value: 1

[adxl345]
cs_pin: ToolHead:PA0
spi_speed: 5000000
axes_map: x,-z,y
spi_software_sclk_pin: ToolHead:PA5
spi_software_mosi_pin: ToolHead:PA7
spi_software_miso_pin: ToolHead:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 75
# min_freq: 30
# max_freq: 100
probe_points:
   150,150,10

[prtouch_v2]
pr_version: 2
