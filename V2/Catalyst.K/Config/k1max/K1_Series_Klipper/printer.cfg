[bed_mesh]
speed: 250
mesh_min: 5,5
mesh_max: 295,295
probe_count: 5,5
fade_start: 1.0
fade_end: 0.0
fade_target:0
split_delta_z: .025
move_check_distance: 50.0
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: .2

[bed_screws]
screw1: 30,30
screw1_name: front left
screw2: 30,270
screw2_name: back left
screw3: 270,270
screw3_name: back right
screw4: 270,30
screw4_name: front right

[display_status]

[printer]
