Section "InputClass"
    Identifier           "Cadwell abs evdev"
    MatchProduct         "Cadwell Laboratories, Inc. TouchScreen"
    MatchUSBID           "27c0:0859"
    MatchDevicePath      "/dev/input/event*"
    Driver               "evdev"
    Option "Ignore"      "off"
    Option "Mode"        "Absolute"
    Option "SwapAxes"    "off"
    Option "InvertX"     "on"
    Option "InvertY"     "off"
EndSection

