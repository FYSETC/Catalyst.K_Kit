# K1-SE
# Version: v1.0.0
# ToolHead: chip: stm32g431
# bed_mcu: chip: GD32E230F8P6
# mcu: chip: stm32h723

[fan_feedback]
# fan0_pin: nozzle_mcu:PB3 # model fan
fan0_pin: ToolHead:PB11 # throat fan
fan1_pin: PC2 # backplane fan
print_delay_time: 5
current_delay_time: 2

[custom_macro]
default_bed_temp: 50
default_extruder_temp: 240
g28_ext_temp: 140

# 产品定义参数
[gcode_macro product_param]
# 模型成型尺寸
variable_bed_size_x: 220
variable_bed_size_y: 220
variable_bed_size_z: 220
# 支持最高温度
variable_nozzle_temp: 300
variable_bed_temp: 100
variable_chamber_temp: 60
gcode: